<text x="86" y="52" style="font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:30px;fill:#ffffff">Sprinto outbound agent: components map</text>
<text x="2320" y="50" text-anchor="end" style="font-family:'Instrument Sans',sans-serif;font-size:18px;fill:#b8c4ca">Companies found every morning, a checked draft out. The Growth Lead decides.</text>
<text x="40" y="118" class="col">1  FIND</text><text x="420" y="118" class="col">2  RESEARCH</text><text x="800" y="118" class="col">3  JUDGE</text><text x="1610" y="118" class="col">4  REVIEW</text><text x="1990" y="118" class="col">5  SEND</text><rect x="40" y="150" width="160" height="150" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="40" y="150" width="160" height="150"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Daily timer</div><div class="b">08:00 IST, with nobody signed in.</div></div></foreignObject><rect x="210" y="150" width="160" height="150" rx="6" fill="#f7f9fa" stroke="#2B6CB0" stroke-width="4"/><foreignObject x="210" y="150" width="160" height="150"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#2B6CB0">PEOPLE</div><div class="t">Growth Lead</div><div class="b">Find companies now, or paste domains.</div></div></foreignObject><rect x="40" y="340" width="330" height="200" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="40" y="340" width="330" height="200"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Hunter Discover</div><div class="b">Free. B2B SaaS, 11 to 200 people, in the US, UK, India, Canada and Australia. Skips any company researched before. Spares wait in a queue.</div></div></foreignObject><rect x="40" y="580" width="330" height="130" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="40" y="580" width="330" height="130"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Run store (Neon)</div><div class="b">Runs, one decision record per company, cached pages.</div></div></foreignObject><rect x="420" y="150" width="330" height="150" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="420" y="150" width="330" height="150"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Server research chain</div><div class="b">Each request researches for about 2 minutes, then hands on to the next. The page can be closed.</div></div></foreignObject><rect x="420" y="330" width="330" height="230" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="420" y="330" width="330" height="230"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Site reader</div><div class="b">The company&#x27;s own public pages only. Respects robots.txt and stops at blocks. Up to 4 extra pages when a fact is missing; code picks which page.</div></div></foreignObject><rect x="800" y="130" width="760" height="510" rx="6" fill="#e3f1f2" stroke="#1d5a33" stroke-width="4"/><text x="820" y="168" class="aititle">AI SECTION: every point where the model uses judgment</text><text x="820" y="196" class="aisub">Claude Haiku reads and grades, Claude Sonnet writes. Each point has its own test cases.</text><rect x="820" y="220" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="834" y="259" class="chip"><tspan class="chipn">01</tspan>  Already certified? (with the quote)</text><rect x="820" y="300" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="834" y="339" class="chip"><tspan class="chipn">02</tspan>  Is it B2B SaaS?</text><rect x="820" y="380" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="834" y="419" class="chip"><tspan class="chipn">03</tspan>  Stage and size signal</text><rect x="820" y="460" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="834" y="499" class="chip"><tspan class="chipn">04</tspan>  Trigger: what changed</text><rect x="820" y="540" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="834" y="579" class="chip"><tspan class="chipn">05</tspan>  Two pains from the evidence</text><rect x="1185" y="220" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="1199" y="259" class="chip"><tspan class="chipn">06</tspan>  What this role is measured on</text><rect x="1185" y="300" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="1199" y="339" class="chip"><tspan class="chipn">07</tspan>  Email: hook, pain, value, ask</text><rect x="1185" y="380" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="1199" y="419" class="chip"><tspan class="chipn">08</tspan>  Refuse when there is no trigger</text><rect x="1185" y="460" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="1199" y="499" class="chip"><tspan class="chipn">09</tspan>  Grade each sentence</text><rect x="1185" y="540" width="350" height="64" rx="6" fill="#f7f9fa" stroke="#1d5a33" stroke-width="3"/><text x="1199" y="579" class="chip"><tspan class="chipn">10</tspan>  Follow past corrections</text><rect x="800" y="680" width="360" height="190" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="800" y="680" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Qualification rules (code)</div><div class="b">Certified, not B2B SaaS or too small: dropped. Unclear: flagged. Every quote must be on its page. A drop is replaced by a spare.</div></div></foreignObject><rect x="1200" y="680" width="360" height="190" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="1200" y="680" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Find the person (code)</div><div class="b">One Hunter search, plus a senior-only one if nobody fits. Ranked: security, engineering, operations, CEO. Confidence 70+. Large companies need a security lead.</div></div></foreignObject><rect x="1610" y="150" width="330" height="190" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="1610" y="150" width="330" height="190"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Review screen</div><div class="b">Only selected companies: an org chart each, the draft and its evidence. A research summary shows every company dropped and why.</div></div></foreignObject><rect x="1610" y="380" width="330" height="120" rx="6" fill="#f7f9fa" stroke="#2B6CB0" stroke-width="4"/><foreignObject x="1610" y="380" width="330" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#2B6CB0">PEOPLE</div><div class="t">Growth Lead edits or skips</div><div class="b">Every change is kept as a correction.</div></div></foreignObject><rect x="1610" y="540" width="330" height="160" rx="6" fill="#f7f9fa" stroke="#8a2a1c" stroke-width="4"/><foreignObject x="1610" y="540" width="330" height="160"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#8a2a1c">HUMAN TAKES OVER</div><div class="t">Growth Lead approves every send</div><div class="b">Nothing reaches a prospect without him. Flagged companies never enter the list.</div></div></foreignObject><rect x="1990" y="150" width="330" height="160" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="1990" y="150" width="330" height="160"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Gmail (SMTP)</div><div class="b">Sends to the operator&#x27;s own inbox. A CC goes only to addresses he allowed; any other recipient is ignored.</div></div></foreignObject><rect x="1990" y="350" width="330" height="120" rx="6" fill="#f7f9fa" stroke="#2B6CB0" stroke-width="4"/><foreignObject x="1990" y="350" width="330" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#2B6CB0">PEOPLE</div><div class="t">Growth Lead sends it on</div><div class="b">Outside the app, to the real prospect.</div></div></foreignObject><text x="40" y="926" class="col">6  LEARN AND PROVE</text><rect x="40" y="945" width="700" height="140" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="40" y="945" width="700" height="140"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Corrections store (Neon)</div><div class="b">Before and after of every edit, its reason and which parts changed. The 3 closest go back to the writer; they never add facts. Paused if over half a run is skipped.</div></div></foreignObject><rect x="800" y="945" width="760" height="140" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="800" y="945" width="760" height="140"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Tests</div><div class="b">Unit tests for every rule and failure (Hunter limits, blocked sites, Claude errors). Browser tests in Chrome with accessibility checks. A separate grader checks every draft.</div></div></foreignObject><rect x="1610" y="945" width="710" height="140" rx="6" fill="#f7f9fa" stroke="#5d6b72" stroke-width="4"/><foreignObject x="1610" y="945" width="710" height="140"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#5d6b72">DATA AND SYSTEMS</div><div class="t">Kill numbers</div><div class="b">Weekly check (metrics.py): rewrite rate, minutes per company, false qualifies, contact accuracy, cost, against the kill criteria. Average disagreement shows on Review.</div></div></foreignObject><path d="M 120 300 L 120 340" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="120" cy="320" r="16" fill="#1f3038"/><text x="120" y="326" text-anchor="middle" class="num">1</text><path d="M 290 300 L 290 340" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="290" cy="320" r="16" fill="#1f3038"/><text x="290" y="326" text-anchor="middle" class="num">2</text><path d="M 205 540 L 205 580" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="205" cy="560" r="16" fill="#1f3038"/><text x="205" y="566" text-anchor="middle" class="num">3</text><path d="M 370 645 L 395 645 L 395 225 L 420 225" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="395" cy="440" r="16" fill="#1f3038"/><text x="395" y="446" text-anchor="middle" class="num">4</text><path d="M 585 300 L 585 330" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="585" cy="315" r="16" fill="#1f3038"/><text x="585" y="321" text-anchor="middle" class="num">5</text><path d="M 750 445 L 800 445" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="775" cy="445" r="16" fill="#1f3038"/><text x="775" y="451" text-anchor="middle" class="num">6</text><path d="M 980 640 L 980 680" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="980" cy="660" r="16" fill="#1f3038"/><text x="980" y="666" text-anchor="middle" class="num">7</text><path d="M 1160 770 L 1200 770" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1180" cy="770" r="16" fill="#1f3038"/><text x="1180" y="776" text-anchor="middle" class="num">8</text><path d="M 1380 680 L 1380 640" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1380" cy="660" r="16" fill="#1f3038"/><text x="1380" y="666" text-anchor="middle" class="num">9</text><text x="1404" y="666" class="lab">feeds the writer</text><path d="M 1560 245 L 1610 245" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1585" cy="245" r="16" fill="#1f3038"/><text x="1585" y="251" text-anchor="middle" class="num">10</text><path d="M 1775 340 L 1775 380" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1775" cy="360" r="16" fill="#1f3038"/><text x="1775" y="366" text-anchor="middle" class="num">11</text><path d="M 1775 500 L 1775 540" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1775" cy="520" r="16" fill="#1f3038"/><text x="1775" y="526" text-anchor="middle" class="num">12</text><path d="M 1940 620 L 1965 620 L 1965 230 L 1990 230" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="1965" cy="430" r="16" fill="#1f3038"/><text x="1965" y="436" text-anchor="middle" class="num">13</text><path d="M 2155 310 L 2155 350" fill="none" stroke="#1f3038" stroke-width="3" marker-end="url(#ah)"/><circle cx="2155" cy="330" r="16" fill="#1f3038"/><text x="2155" y="336" text-anchor="middle" class="num">14</text><path d="M 1610 440 L 1588 440 L 1588 900 L 390 900 L 390 945" fill="none" stroke="#1f3038" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="1588" cy="780" r="16" fill="#1f3038"/><text x="1588" y="786" text-anchor="middle" class="num">15</text><text x="1200" y="892" class="lab">every edit and skip</text><path d="M 740 1015 L 775 1015 L 775 560 L 800 560" fill="none" stroke="#1f3038" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="775" cy="800" r="16" fill="#1f3038"/><text x="775" y="806" text-anchor="middle" class="num">16</text><path d="M 980 945 L 980 870" fill="none" stroke="#1f3038" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="980" cy="922" r="16" fill="#1f3038"/><text x="980" y="928" text-anchor="middle" class="num">17</text><text x="1000" y="930" class="lab">tests every rule and AI point</text><rec
