<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review dashboard: three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Host+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 15px/1.5 system-ui, sans-serif; background: #e9e9e6; color: #111; }
.pick { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
.pick a { padding: 8px 14px; border: 1px solid #111; border-radius: 8px; color: #111; text-decoration: none; font-weight: 600; }
.pick a[aria-current="true"] { background: #111; color: #fff; }
.pick span { color: #555; font-size: 14px; }
.cap { padding: 16px 16px 8px; font-weight: 600; }
.phone { width: 375px; margin: 0 16px 32px; border: 1px solid #999; border-radius: 12px; overflow: hidden; }
.desk-frame { margin: 0 16px 24px; border: 1px solid #999; border-radius: 12px; overflow: hidden; }

/* ---------- shared screen skeleton, coloured by tokens ---------- */
.screen { container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font); }
.screen p { text-wrap: pretty; }
.screen h1 { font-size: 24px; font-weight: 600; } .screen h2 { font-size: 17px; font-weight: 600; } .screen h3 { font-size: 15px; font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .lbl { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: var(--rule); }
.top b { font-size: 17px; } .top nav { display: flex; gap: 16px; } .top nav span[data-on] { font-weight: 600; border-bottom: 2px solid var(--ink); }
.pad { padding: 24px; display: grid; gap: 24px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--kgap); }
.kpi { padding: var(--kpad); background: var(--kbg); border: var(--kborder); border-radius: var(--r); }
.kpi .n { font-size: 32px; line-height: 1.1; display: block; } .kpi.key .n { color: var(--key); }
.kpi small { color: var(--muted); font-size: 13px; display: block; }
.panel { background: var(--panel); border: var(--pborder); border-radius: var(--r); padding: var(--ppad); }
.panel > h2 { margin-bottom: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.funnel { display: grid; gap: 8px; }
.funnel div { display: grid; grid-template-columns: 110px 1fr 28px; gap: 8px; align-items: center; font-size: 14px; }
.funnel i { height: 14px; border-radius: 4px; background: var(--bar); width: calc(var(--w) * 1%); transform-origin: left; }
.funnel div:last-child i { background: var(--accent); }
.funnel b { text-align: right; font-weight: 500; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.sent { background: var(--ok-bg); color: var(--ok); } .chip.hold { background: var(--warn-bg); color: var(--warn); }
.chip.drop { background: var(--bad-bg); color: var(--bad); } .chip.flag { background: var(--info-bg); color: var(--info); }
.chip svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.queue { list-style: none; padding: 0; display: grid; gap: 0; }
.queue li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.queue li p { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.draft p { max-width: 62ch; margin-top: 8px; } .draft .subj { font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.btn { font: 600 14px var(--font); min-height: 40px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.notreached { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.notreached span { font-size: 13px; padding: 4px 10px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); }
.notreached b { color: var(--ink); font-weight: 600; }
.person h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .person p { font-size: 14px; margin-top: 4px; }
.why { color: var(--muted); }
.maplist { display: none; gap: 12px; }
@container (max-width: 640px) {
  .pad { padding: 16px; gap: 16px; } .top { padding: 12px 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: 1fr; }
  .kpi .n { font-size: 24px; } .btn { flex: 1 1 100%; justify-content: center; }
}

/* ---------- A: Warm ledger (today's cream, as a dashboard; org chart as a tree) ---------- */
[data-d="A"] { --bg: #F3EEE3; --panel: transparent; --ink: #111; --muted: #5a5448; --line: #d6cdb8; --accent: #E2622A; --on-accent: #111; --key: #9a3d12; --bar: #111;
  --ok: #2d5a1f; --ok-bg: #dde8d3; --warn: #6e4800; --warn-bg: #f2e2b8; --bad: #8e2f12; --bad-bg: #f1d6cb; --info: #3b4a52; --info-bg: #e0e2dc;
  --font: "Familjen Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace; --r: 10px; --rule: 2px solid #111;
  --kgap: 0; --kpad: 12px 16px 12px 0; --kbg: transparent; --kborder: 0; --pborder: 0; --ppad: 16px 0 0; }
[data-d="A"] .kpis { border-top: 2px solid #111; border-bottom: 1px solid var(--line); }
[data-d="A"] .panel { border-top: 2px solid #111; border-radius: 0; }
.tree { display: grid; justify-items: center; }
.tree .root { padding: 8px 16px; border: 2px solid var(--ink); border-radius: var(--r); font-weight: 600; background: var(--bg); }
.tree .stem { width: 2px; height: 20px; background: var(--ink); }
.tree .kids { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; border-top: 2px solid var(--ink); }
.tree .kid { display: grid; justify-items: center; }
.tree .co { width: 100%; padding: 8px 12px; border: 1px solid var(--ink); border-radius: var(--r); text-align: center; }
.tree .person { width: 100%; padding: 12px; border-radius: var(--r); background: #EAE3D3; }
@container (max-width: 640px) { .tree .kids { grid-template-columns: 1fr; border-top: 0; } .tree .kid > .stem:first-child { display: none; } }
[data-d="A"] .btn { transition: transform .15s, box-shadow .15s; }
[data-d="A"] .btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 #111; }
[data-d="A"] .btn:active { transform: none; box-shadow: none; }
[data-d="A"] .btn.primary svg { transition: transform .2s; } [data-d="A"] .btn.primary:hover svg { transform: translate(3px, -3px); }

/* ---------- B: Control room (dark, tiles, radial reach map, expressive motion) ---------- */
[data-d="B"] { --bg: #0B0B10; --panel: #15151d; --ink: #F5F5F7; --muted: #9a9aa6; --line: #2a2a36; --accent: #FF7A1A; --on-accent: #0B0B10; --key: #FF7A1A; --bar: #6f9bff;
  --ok: #8fe0a4; --ok-bg: #16301e; --warn: #ffd27a; --warn-bg: #3a2c0c; --bad: #ff9c8a; --bad-bg: #3a1710; --info: #a9c1ff; --info-bg: #1a2444;
  --font: "Host Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", monospace; --r: 14px; --rule: 1px solid #2a2a36;
  --kgap: 12px; --kpad: 16px; --kbg: #15151d; --kborder: 1px solid #2a2a36; --pborder: 1px solid #2a2a36; --ppad: 20px; }
[data-d="B"] .kpi.key { border-color: #FF7A1A; }
.radial { width: 100%; height: auto; display: block; }
.radial text { fill: var(--ink); font: 13px var(--font); } .radial .sub { fill: var(--muted); font-size: 12px; }
.radial .edge { stroke: #6f9bff; stroke-width: 1.5; fill: none; } .radial .edge.dim { stroke: #2a2a36; }
.radial .node { fill: #15151d; stroke: #6f9bff; stroke-width: 1.5; } .radial .node.hit { fill: #FF7A1A; stroke: #FF7A1A; cursor: pointer; }
.radial .node.dim { stroke: #3a3a48; } .radial .hub { fill: #F5F5F7; }
.radial .halo { fill: none; stroke: #FF7A1A; stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
.radial g[data-i] { cursor: pointer; } .radial g[data-i][aria-pressed="true"] .node.hit { stroke: #F5F5F7; stroke-width: 3; }
.sel { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
[data-d="B"] .btn.primary { box-shadow: 0 0 0 0 rgba(255, 122, 26, .55); }
[data-d="B"] .btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); }
[data-d="B"] .btn:not(.primary):hover { background: #20202b; border-color: #6f9bff; }
@container (max-width: 640px) { [data-d="B"] .radial, [data-d="B"] .sel { display: none; } [data-d="B"] .maplist { display: grid; } }

/* ---------- C: Frost board (cool light cards, people placed in role lanes) ---------- */
[data-d="C"] { --bg: #f7f9fa; --panel: #ffffff; --ink: #1f3038; --muted: #5d6b72; --line: #dbe2e6; --accent: #0d7480; --on-accent: #ffffff; --key: #0d7480; --bar: #9fb4bd;
  --ok: #1d5a33; --ok-bg: #dcefe2; --warn: #6b4a00; --warn-bg: #f6e7bd; --bad: #8a2a1c; --bad-bg: #f6dcd6; --info: #2f4a5a; --info-bg: #e2eaee;
  --font: "Instrument Sans", system-ui, sans-serif; --mono: "DM Mono", monospace; --r: 8px; --rule: 1px solid #dbe2e6;
  --kgap: 12px; --kpad: 14px 16px; --kbg: #ffffff; --kborder: 1px solid #dbe2e6; --pborder: 1px solid #dbe2e6; --ppad: 20px; }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lane { background: #ecf0f2; border-radius: var(--r); padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.lane > .lbl b { color: var(--ink); } .lane .person { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.lane .none { font-size: 13px; color: var(--muted); }
@container (max-width: 640px) { .lanes { grid-template-columns: 1fr; } .lane { min-height: 0; } }
[data-d="C"] .btn { transition: color .2s, transform .1s; z-index: 0; }
[data-d="C"] .btn::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .25s; z-index: -1; }
[data-d="C"] .btn:hover { color: #fff; } [data-d="C"] .btn:hover::before { transform: scaleX(1); }
[data-d="C"] .btn:active { transform: scale(.97); }

/* ---------- motion (all off when the system asks for less) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .45s both; animation-delay: calc(var(--i, 0) * 70ms); }
  .funnel i { animation: grow .7s both; animation-delay: calc(var(--i, 0) * 90ms); }
  .radial .edge { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .9s forwards; animation-delay: calc(var(--i, 0) * 120ms); }
  .radial .halo { animation: ping 2.4s infinite; animation-delay: calc(var(--i, 0) * 300ms); }
  [data-d="B"] .btn.primary { animation: glow 2.2s infinite; } [data-d="B"] .btn.primary:hover::after { animation: sweep .8s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ping { 0% { opacity: .8; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.4); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255,122,26,.55); } 70%, 100% { box-shadow: 0 0 0 12px rgba(255,122,26,0); } }
  @keyframes sweep { to { transform: translateX(120%); } }
}
</style>
</head>
<body>
<div class="pick" id="pick"></div>
<div id="out"></div>
<script>
(() => {
  const DIRS = { A: "Warm ledger", B: "Control room", C: "Frost board" };
  const NOTE = { A: "Today's cream and type, turned into a dashboard. Reach map is a top-down organisation tree.",
                 B: "Dark tiles, a radial reach map you can click, glowing primary button. The most motion.",
                 C: "Cool light cards. People are placed in lanes by their role, so you see who the priority list picked." };
  const d = (new URLSearchParams(location.search).get("d") || "A").toUpperCase();
  document.getElementById("pick").innerHTML = Object.keys(DIRS).map(k =>
    `<a href="?d=${k}" aria-current="${k === d}">Direction ${k}: ${DIRS[k]}</a>`).join("") + `<span>${NOTE[d]}</span>`;

  const ICON = { send: '<path d="M4 12l16-7-6 15-3-6z"/><path d="M11 14l9-9"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
                 flag: '<path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', pencil: '<path d="M5 19l1-4L16 5l3 3L9 18z"/>' };
  const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
  const chip = (cls, icon, label) => `<span class="chip ${cls}">${svg(icon)}${label}</span>`;
  const REACHED = [
    { co: "Dub", dom: "dub.co", who: "Steven Tey", role: "CEO", lane: 3, st: chip("sent", "check", "Sent to me"),
      about: "Runs Dub; measured on revenue growth and winning larger customers.",
      why: "Dub launched a Startup Program and lists an Enterprise plan, so bigger buyers will ask for a security report." },
    { co: "Plausible Analytics", dom: "plausible.io", who: "Marko Saric", role: "Co-Founder", lane: 3, st: chip("sent", "check", "Sent to me"),
      about: "Co-founder; owns growth and keeps the small team's time on the product.",
      why: "Their May post reports an 84% lift in trial signups, and the site sells an Enterprise plan with no certification shown." },
    { co: "Retool", dom: "retool.com", who: "David Hsu", role: "CEO", lane: 3, st: chip("sent", "pencil", "Rewritten"),
      about: "Founder and CEO; measured on revenue growth and closing enterprise deals.",
      why: "The new app builder is sold on enterprise security and governance, right after the Ramp customer story." },
    { co: "Loops", dom: "loops.so", who: "Adam K", role: "CTO", lane: 1, st: chip("hold", "flag", "Needs you"),
      about: "CTO; ships the roadmap while keeping the security posture enterprise buyers expect.",
      why: "Loops launched Goals on 1 Jul. Draft held back: one sentence is not backed by the facts." } ];
  const NOT = [ ["Clerk", "SOC 2 Type 2 on site"], ["Linear", "ISO 27001 on /security"], ["PostHog", "SOC 2 Type 2 on site"], ["WorkOS", "SOC 2 Type 2 on site"],
                ["Vanta", "SOC 2 and ISO 27001"], ["Allbirds", "sells to consumers"], ["Tally", "Hunter timed out"], ["SavvyCal", "no trigger on 5 pages"],
                ["Duolingo", "could not tell who it sells to"], ["sprinto.com", "site blocked access"] ];
  const KPIS = [ ["Need you", 5, "1 held draft, 4 flagged", "key"], ["Drafts ready", 3, "of 4 written"], ["Sent to me", 3, "1 rewritten first"],
                 ["Dropped", 6, "5 certified, 1 not B2B"], ["Hunter left", 41, "of 50 this month"], ["Disagreement", "0.42", "average, last 10 drafts"] ];
  const FUNNEL = [ ["Pasted", 14], ["Pages read", 13], ["Qualified", 5], ["Contact found", 4], ["Drafted", 4], ["Sent to me", 3] ];
  const LANES = ["Security lead", "Engineering lead", "Operations lead", "Founder or CEO"];

  const person = (p, i) => `<div class="person rise" style="--i:${i + 3}"><h3>${p.who} <span class="muted mono">${p.role}</span> ${p.st}</h3>
    <p>${p.about}</p><p class="why">Why now: ${p.why}</p></div>`;
  const notReached = () => `<div class="notreached">${NOT.map(n => `<span><b>${n[0]}</b> ${n[1]}</span>`).join("")}</div>`;

  const mapA = () => `<div class="tree"><div class="root">Run of 17 Nov · 14 domains</div><div class="stem"></div>
    <div class="kids">${REACHED.map((p, i) => `<div class="kid"><div class="stem"></div><div class="co"><b>${p.co}</b> <span class="mono muted">${p.dom}</span></div>
      <div class="stem"></div>${person(p, i)}</div>`).join("")}</div></div><p class="lbl" style="margin-top:24px">Not reached, and why (10)</p>${notReached()}`;

  const mapB = () => {
    const cx = 380, cy = 210, pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
    const hit = REACHED.map((p, i) => { const a = -54 + i * 36, [x1, y1] = pt(a, 120), [x2, y2] = pt(a, 235);
      return `<g data-i="${i}" role="button" tabindex="0" aria-pressed="${i === 0}" aria-label="${p.who}, ${p.role} at ${p.co}">
        <path class="edge" style="--i:${i}" d="M${cx} ${cy}L${x1} ${y1}L${x2} ${y2}"/><circle class="node" cx="${x1}" cy="${y1}" r="7"/>
        <text text-anchor="end" x="${x1 - 12}" y="${a < 0 ? y1 - 8 : y1 + 20}">${p.co}</text><circle class="halo" style="--i:${i}" cx="${x2}" cy="${y2}" r="9"/>
        <circle class="node hit" cx="${x2}" cy="${y2}" r="9"/><text x="${x2 + 16}" y="${y2 - 2}">${p.who}</text><text class="sub" x="${x2 + 16}" y="${y2 + 14}">${p.role}</text></g>`; }).join("");
    const miss = NOT.map((n, i) => { const a = 112 + i * 15.2, [x, y] = pt(a, 130);
      return `<path class="edge dim" style="--i:${i}" d="M${cx} ${cy}L${x} ${y}"/><circle class="node dim" cx="${x}" cy="${y}" r="4"/>
        <text class="sub" text-anchor="end" x="${x - 10}" y="${y + 4}">${n[0]}: ${n[1]}</text>`; }).join("");
    return `<svg class="radial" viewBox="0 0 800 420" role="group" aria-label="Reach map">${miss}${hit}
      <circle class="hub" cx="${cx}" cy="${cy}" r="12"/><text text-anchor="middle" x="${cx}" y="${cy - 24}">This run</text></svg>
      <div class="sel" aria-live="polite">${person(REACHED[0], 0)}</div>
      <div class="maplist">${REACHED.map(person).join("")}${notReached()}</div>`;
  };

  const mapC = () => `<div class="lanes">${LANES.map((l, n) => { const here = REACHED.filter(p => p.lane === n);
    return `<div class="lane"><p class="lbl">Priority ${n + 1} · <b>${l}</b></p>${here.map((p, i) => `<div><p class="mono muted" style="font-size:13px">${p.co} · ${p.dom}</p>${person(p, i)}</div>`).join("")
      || `<p class="none">No one with this role was found at a qualified company.</p>`}</div>`; }).join("")}</div>
    <p class="lbl" style="margin-top:20px">Not reached, and why (10)</p>${notReached()}`;

  const screen = () => `<div class="screen" data-d="${d}">
    <div class="top"><b>Sprinto outbound</b><nav><span>Run</span><span data-on>Review</span></nav></div>
    <div class="pad">
      <div class="head"><div><h1>Run of 14 domains</h1><p class="muted">Started 17 Nov, 10:04 · finished in 6 min 12 s · Claude cost <span class="mono">$0.31</span></p></div>
        <button class="btn primary">${svg("send")}Send 3 ready drafts to my inbox</button></div>
      <div class="kpis">${KPIS.map((k, i) => `<div class="kpi rise ${k[3] || ""}" style="--i:${i}"><span class="lbl">${k[0]}</span><span class="n mono" data-n="${k[1]}">${k[1]}</span><small>${k[2]}</small></div>`).join("")}</div>
      <div class="panel"><h2>Who we reached, and why</h2>${{ A: mapA, B: mapB, C: mapC }[d]()}</div>
      <div class="two">
        <div class="panel draft"><h2>Loops · needs you</h2><p class="lbl">Subject</p><p class="subj">Security reviews after Loops Goals</p>
          <p>Hi Adam, Loops launched Goals on 1 July, which gives teams one more reason to run their product email through you. Larger buyers often ask for a SOC 2 report before they sign.</p>
          <p class="muted mono" style="font-size:13px">Trace: 3 of 4 sentences from the evidence · 1 made up · 0 banned</p>
          <div class="acts"><button class="btn primary">${svg("send")}Send to my inbox</button><button class="btn">${svg("pencil")}I rewrote it</button><button class="btn">${svg("x")}Skip</button></div></div>
        <div class="panel"><h2>Where the 14 went</h2><div class="funnel">${FUNNEL.map((f, i) => `<div><span>${f[0]}</span><i style="--w:${f[1] / 14 * 100};--i:${i}"></i><b class="mono">${f[1]}</b></div>`).join("")}</div>
          <h2 style="margin-top:20px">Queue</h2><ul class="queue">${REACHED.map(p => `<li><b>${p.co}</b>${p.st}<p>${p.who}, ${p.role}</p></li>`).join("")}
            <li><b>Tally</b>${chip("flag", "flag", "Flagged")}<p>Could not reach Hunter (timeout).</p></li><li><b>Clerk</b>${chip("drop", "x", "Disqualified")}<p>Site says SOC 2 Type 2 compliant.</p></li></ul></div>
      </div></div></div>`;

  document.getElementById("out").innerHTML = `<p class="cap">Direction ${d}: ${DIRS[d]} · desktop</p><div class="desk-frame">${screen()}</div>
    <p class="cap">Direction ${d} · phone (375 px)</p><div class="phone">${screen()}</div>`;

  document.querySelectorAll(".radial").forEach(map => { const sel = map.parentElement.querySelector(".sel");
    const choose = g => { map.querySelectorAll("g[data-i]").forEach(x => x.setAttribute("aria-pressed", x === g)); sel.innerHTML = person(REACHED[+g.dataset.i], 0); };
    map.querySelectorAll("g[data-i]").forEach(g => { g.addEventListener("click", () => choose(g));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(g); } }); }); });

  if (matchMedia("(prefers-reduced-motion: no-preference)").matches) document.querySelectorAll("[data-n]").forEach(el => {
    const end = +el.dataset.n, whole = Number.isInteger(end), t0 = performance.now();
    const tick = t => { const k = Math.min(1, (t - t0) / 700), v = end * (1 - Math.pow(1 - k, 3));
      el.textContent = whole ? Math.round(v) : v.toFixed(2); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
